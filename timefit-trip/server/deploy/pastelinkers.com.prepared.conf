# Production cutover: immutable release 8321967df4387a060b2577972a1c913fddccd5fe
# Query strings and Referer are deliberately excluded from OAuth access logs.
log_format pastelinkers_production_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name pastelinkers.com www.pastelinkers.com;
    access_log /var/log/nginx/pastelinkers-production.access.log pastelinkers_production_safe;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://pastelinkers.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.pastelinkers.com;
    ssl_certificate /etc/letsencrypt/live/pastelinkers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pastelinkers.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/pastelinkers-production.access.log pastelinkers_production_safe;
    return 301 https://pastelinkers.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pastelinkers.com;
    ssl_certificate /etc/letsencrypt/live/pastelinkers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pastelinkers.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/pastelinkers-production.access.log pastelinkers_production_safe;
    client_max_body_size 6m;

    location ^~ /tribble/ {
        client_max_body_size 2k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Replace user-supplied values; the app trusts this only from loopback.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        proxy_send_timeout 12s;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_intercept_errors off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        access_log off;
    }

    # The new image serves static files; health routes reach Django and its DB.
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_intercept_errors off;
    }
}
